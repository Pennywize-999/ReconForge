[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelrecon"
version = "1.1.0"
authors = [
  { name="SentinelRecon Project" },
]
description = "Adaptive reconnaissance & vulnerability correlation engine for authorized security testing."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "jinja2>=3.1.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Topic :: Security",
]

[tool.setuptools.package-data]
sentinelrecon = ["templates/*.html", "wordlists/*.txt", "wordlists/categories/*.txt"]
reconforge = ["templates/*.html", "wordlists/*.txt", "wordlists/categories/*.txt"]

[tool.setuptools.packages.find]
include = ["sentinelrecon*", "reconforge*"]

[project.scripts]
sentinelrecon = "sentinelrecon.cli:main"
reconforge = "sentinelrecon.cli:main"
