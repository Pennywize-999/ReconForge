[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge"
version = "1.0.0"
authors = [
  { name="ReconForge Project" },
]
description = "First-level reconnaissance and security-assessment framework for authorized security testing."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "jinja2>=3.1.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Topic :: Security",
]

[tool.setuptools.package-data]
reconforge = ["templates/*.html", "wordlists/*.txt", "wordlists/categories/*.txt"]

[tool.setuptools.packages.find]
include = ["reconforge*"]

[project.scripts]
reconforge = "reconforge.cli:main"
